<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Precaricamento delle due immagini principali -->
  <link
    rel="preload"
    as="image"
    href="assets/chiesa.png?v=13"
    fetchpriority="high"
  />

  <link
    rel="preload"
    as="image"
    href="assets/invito.png?v=13"
  />

  <!--
    Impostiamo subito lo stato di caricamento.

    NON facciamo più il refresh immediatamente.

    Alla primissima apertura aspettiamo prima che
    immagini e WebView siano pronte, poi facciamo
    un solo refresh automatico.
  -->
  <script>
    (function () {

      document.documentElement.classList.add("is-loading");

      const reloadKey = "wedding-first-reload-v5";

      let primoCaricamento = false;

      try {

        primoCaricamento =
          !sessionStorage.getItem(reloadKey);

      } catch (error) {

        /*
          Se sessionStorage non fosse disponibile,
          evitiamo qualsiasi rischio di loop.
        */
        primoCaricamento = false;

      }

      window.__weddingFirstLoad =
        primoCaricamento;

      window.__weddingReloadKey =
        reloadKey;

    })();
  </script>


  <meta
    name="theme-color"
    content="#f7f3ed"
  />

  <title>
    Salvatore e Rosa
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=14"
  />

</head>


<body>


  <!-- =========================
       LOADER INIZIALE
       ========================= -->

  <div
    class="site-loader"
    aria-label="Caricamento invito"
    aria-live="polite"
  >

    <div class="loader-content">

      <div class="loader-monogram">
        SR
      </div>

      <div class="loader-line"></div>

      <div class="loader-text">
        Salvatore & Rosa
      </div>

    </div>

  </div>



  <!-- =========================
       INVITO
       ========================= -->

  <main class="page">

    <section
      class="wedding-card"
      aria-label="Invito di matrimonio di Salvatore e Rosa"
    >


      <!--
        Checkbox invisibile:
        permette apertura e chiusura senza JavaScript
      -->
      <input
        class="open-toggle"
        type="checkbox"
        id="open-card"
        aria-label="Apri o chiudi l'invito"
      />


      <div class="scene">


        <!-- =========================
             INVITO INTERNO
             ========================= -->

        <div class="inside">

          <img
            src="assets/invito.png?v=13"
            alt="Invito al matrimonio di Salvatore e Rosa"
            draggable="false"
          />

        </div>



        <!-- =========================
             ANTA SINISTRA
             ========================= -->

        <label
          class="door door-left"
          for="open-card"
          aria-hidden="true"
        >

          <span class="door-image"></span>

        </label>



        <!-- =========================
             ANTA DESTRA
             ========================= -->

        <label
          class="door door-right"
          for="open-card"
          aria-hidden="true"
        >

          <span class="door-image"></span>

        </label>



        <!-- =========================
             TOCCA PER APRIRE
             ========================= -->

        <label
          class="open-hint"
          for="open-card"
        >

          <span class="open-hint__text">
            Tocca per aprire
          </span>

          <span
            class="open-hint__arrow"
            aria-hidden="true"
          >
            ⌄
          </span>

        </label>



        <!-- =========================
             CHIUDI
             ========================= -->

        <label
          class="close-hint"
          for="open-card"
        >
          Chiudi
        </label>


      </div>

    </section>

  </main>



  <!-- =========================
       GESTIONE CARICAMENTO
       ========================= -->

  <script>
    (function () {

      const startTime =
        performance.now();

      let operazioneCompletata =
        false;


      /*
        Le immagini che devono essere sicuramente
        pronte prima di mostrare il sito.
      */
      const immagini = [
        "assets/chiesa.png?v=13",
        "assets/invito.png?v=13"
      ];



      /*
        Scarica e decodifica realmente
        una singola immagine.
      */
      function caricaImmagine(src) {

        return new Promise(function (resolve) {

          const img =
            new Image();


          img.onload =
            async function () {

              try {

                /*
                  Non aspettiamo soltanto il download.

                  decode() aspetta che il browser
                  abbia preparato realmente l'immagine
                  per il rendering.
                */
                if (img.decode) {

                  await img.decode();

                }

              } catch (error) {

                /*
                  Anche se decode dovesse fallire,
                  l'immagine risulta comunque caricata.
                */

              }


              resolve();

            };


          /*
            Non lasciamo mai l'utente bloccato
            se dovesse esserci un problema
            con una singola immagine.
          */
          img.onerror =
            function () {

              resolve();

            };


          img.src = src;

        });

      }



      /*
        Questa funzione viene eseguita quando
        le immagini sono pronte.
      */
      function completaCaricamento() {

        if (operazioneCompletata) {

          return;

        }


        operazioneCompletata = true;



        /* =========================================
           PRIMISSIMA APERTURA
           ========================================= */

        if (window.__weddingFirstLoad) {


          /*
            Registriamo PRIMA che il refresh
            è già stato richiesto.

            In questo modo non può nascere
            un loop di refresh.
          */
          try {

            sessionStorage.setItem(
              window.__weddingReloadKey,
              "1"
            );

          } catch (error) {

            /*
              Anche se sessionStorage dovesse
              fallire, continuiamo.
            */

          }


          /*
            Le immagini ormai sono state caricate.

            Aspettiamo ancora 600ms.

            Questo tempo serve soprattutto alla
            WebView di WhatsApp per terminare
            l'assestamento delle barre e
            delle dimensioni del viewport.

            Durante tutto questo periodo
            l'utente vede soltanto il loader.
          */
          setTimeout(function () {

            window.location.reload();

          }, 600);


          return;

        }



        /* =========================================
           SECONDO CARICAMENTO
           O APERTURE SUCCESSIVE
           ========================================= */


        /*
          Ci assicuriamo che il sito parta sempre
          dalla parte superiore.
        */
        window.scrollTo(
          0,
          0
        );


        const tempoTrascorso =
          performance.now() - startTime;


        /*
          Se tutto è già in cache potrebbe
          caricarsi quasi istantaneamente.

          Manteniamo comunque il loader almeno
          per circa 300ms per evitare flash.
        */
        const attesa =
          Math.max(
            0,
            300 - tempoTrascorso
          );


        setTimeout(function () {


          /*
            Aspettiamo due frame consecutivi.

            Il browser ha così il tempo di:
            1. calcolare il layout;
            2. posizionare correttamente la chiesa;
            3. preparare le immagini;
            4. mostrare poi il contenuto.
          */
          requestAnimationFrame(function () {


            requestAnimationFrame(function () {


              document.documentElement
                .classList
                .remove("is-loading");


            });


          });


        }, attesa);

      }



      /*
        Aspettiamo contemporaneamente
        entrambe le immagini.
      */
      Promise
        .all(
          immagini.map(caricaImmagine)
        )
        .then(
          completaCaricamento
        );



      /*
        SICUREZZA

        Se per qualche motivo una connessione
        dovesse bloccarsi, non lasciamo
        il visitatore sul loader per sempre.

        Dopo 8 secondi procediamo comunque.
      */
      setTimeout(
        completaCaricamento,
        8000
      );


    })();
  </script>


</body>

</html>
